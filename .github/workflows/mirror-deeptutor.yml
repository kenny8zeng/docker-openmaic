name: mirror-deeptutor

# One-off helper: mirror HKUDS/DeepTutor prebuilt image to Docker Hub so a
# bandwidth-constrained home server can pull from docker.io instead of ghcr.io.
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror image (linux/amd64)
        run: |
          SRC=ghcr.io/hkuds/deeptutor:1.6.14
          DST=kenny8zeng/deeptutor:1.6.14
          docker pull --platform linux/amd64 "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          echo "Mirrored $SRC -> $DST" >>"$GITHUB_STEP_SUMMARY"
